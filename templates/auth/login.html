<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

<div class="wrapper">


    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <section class="messages">

                {% for category, message in messages %}
                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}

            </section>
        {% endif %}
    {% endwith %}



    <section class="card">

        <h2>Login</h2>


        <form action="{{ url_for('auth.login') }}" method="POST" class="login-form">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input 
                    type="text"
                    id="username"
                    name="username"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>



            <button type="submit" class="primary-btn">
                Login
            </button>


        </form>


        <p>
            New Here?
            <a href="{{ url_for('auth.add_user_form') }}">
                Create user account
            </a>
        </p>

        <p>
            <a href="{{ url_for('public.home') }}">
                Home
            </a>
        </p>


    </section>


</div>


</body>
</html>
